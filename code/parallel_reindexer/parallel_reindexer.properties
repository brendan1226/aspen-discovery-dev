# ============================================================================
# Parallel Reindexer Configuration
# ============================================================================
# Place this file next to parallel_reindexer.jar or in the Aspen base log path.
#
# All values below show their defaults. Uncomment and adjust as needed.

# Number of worker threads that process grouped works in parallel.
# Each worker gets its own DB connection and GroupedWorkIndexer instance.
# Recommended: 4-8 for most systems. Don't exceed your DB max_connections / 2.
# workerThreadCount=4

# Number of threads the internal Solr ConcurrentUpdateHttp2SolrClient uses.
# This controls how many HTTP connections send documents to Solr simultaneously.
# Should generally match workerThreadCount.
# solrClientThreadCount=4

# Document queue size for the Solr client. Larger = more memory, but smoother throughput.
# solrQueueSize=200

# Max capacity of the in-memory work queue between the producer and workers.
# If workers are faster than the DB cursor, this prevents excessive memory use.
# workQueueCapacity=10000

# Each worker does an intermediate Solr commit after this many works.
# Total effective interval = commitIntervalPerWorker * workerThreadCount
# Too low = "too many searchers warming" errors. Too high = stale results during index.
# commitIntervalPerWorker=5000

# Batch size when fetching work IDs from the database.
# Only affects the MySQL streaming cursor fetch hint.
# dbFetchBatchSize=50000

# Log per-worker statistics at the end of the run.
# perWorkerStats=true

# How often to log a progress report (number of total works processed across all workers).
# progressReportInterval=10000
